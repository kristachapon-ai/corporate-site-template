<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NG Training Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
</head>

<body>

  <main class="admin-page">

    <header class="admin-header">
      <div>
        <p>NG TRAINING</p>
        <h1>QUOTE REQUESTS</h1>
      </div>

      <div>
        ADMIN
      </div>
    </header>


    <section class="admin-summary">

      <article>
        <span>NEW REQUESTS</span>
        <strong>—</strong>
      </article>

      <article>
        <span>IN PROGRESS</span>
        <strong>—</strong>
      </article>

      <article>
        <span>COMPLETED</span>
        <strong>—</strong>
      </article>

    </section>


    <section class="admin-requests">

      <div class="admin-section-heading">
        <div>
          <p>QUOTE MANAGEMENT</p>
          <h2>คำขอใบเสนอราคา</h2>
        </div>

        <span>DATABASE CONNECTION — NEXT STEP</span>
      </div>


      <div class="admin-table-wrap">

        <table class="admin-table">

          <thead>
            <tr>
              <th>REQUEST NO.</th>
              <th>CLIENT</th>
              <th>EVENT</th>
              <th>EVENT DATE</th>
              <th>PARTICIPANTS</th>
              <th>STATUS</th>
              <th></th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td colspan="7">
                กำลังเตรียมเชื่อมต่อ Quote Database
              </td>
            </tr>
          </tbody>

        </table>

      </div>

    </section>

  </main>

</body>
</html>
