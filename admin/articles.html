
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Articles | NG Training Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">

  <style>
    .article-admin {
      margin-top: 36px;
    }

    .article-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .article-toolbar h2 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
    }

    .article-toolbar p {
      margin: 0 0 6px;
      color: var(--color-accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .article-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 46px;
      padding: 12px 20px;
      background: var(--color-accent);
      color: #fff;
      font-family: var(--font-heading);
      font-size: 0.72rem;
      font-weight: 800;
      text-decoration: none;
      border: 0;
      cursor: pointer;
    }

    .article-button:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .article-button.secondary {
      background: var(--color-primary);
    }

    .article-list {
      background: #fff;
      border: 1px solid var(--color-border);
    }

    .article-list-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 130px 110px;
      gap: 20px;
      padding: 18px 24px;
      background: var(--color-primary);
      color: #fff;
      font-family: var(--font-heading);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .article-empty {
      padding: 64px 24px;
      text-align: center;
    }

    .article-empty h3 {
      margin: 0 0 10px;
      font-size: 1.4rem;
    }

    .article-empty p {
      color: var(--color-text-muted);
      font-size: 0.85rem;
      line-height: 1.8;
    }

    .article-empty .article-button {
      margin-top: 18px;
    }

    .article-back {
      display: inline-block;
      margin-top: 24px;
      color: var(--color-text);
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
    }

    .article-back:hover {
      color: var(--color-accent);
    }

    @media (max-width: 760px) {
      .article-admin {
        margin-top: 24px;
      }

      .article-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .article-button {
        width: 100%;
      }

      .article-list-header {
        grid-template-columns: 1fr;
      }

      .article-list-header span:not(:first-child) {
        display: none;
      }

      .article-empty {
        padding: 40px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="admin-page">

    <header class="admin-header">
      <div>
        <p>NG TRAINING</p>
        <h1>SEO ARTICLES</h1>
      </div>

      <a href="/admin/" class="article-button secondary">
        DASHBOARD
      </a>
    </header>

    <section class="article-admin">

      <div class="article-toolbar">
        <div>
          <p>CONTENT MANAGEMENT</p>
          <h2>จัดการบทความ SEO</h2>
        </div>

        <a href="/admin/article-editor.html" class="article-button">
          + เพิ่มบทความใหม่
        </a>
      </div>

      <div class="article-list">

        <div class="article-list-header">
          <span>ARTICLE TITLE</span>
          <span>STATUS</span>
          <span>ACTIONS</span>
        </div>


      </div>

      <a href="/admin/" class="article-back">
        ← กลับหน้า Dashboard
      </a>

    </section>

  </main>
  <script src="../js/articles.js"></script>
</body>
</html>
