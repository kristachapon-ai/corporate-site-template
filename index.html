<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/global.css">
  <title>NG Training | NextGen Training Team</title>

  <meta
    name="description"
    content="NG Training - Corporate Training, Team Building, Sport Day and Workshop"
  >
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">

      <a class="brand" href="#home">
        <img
          src="assets/images/branding/logo.jpg"
          alt="NG Training"
          class="brand-logo"
        >
      </a>

      <nav class="main-nav">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#portfolio">Our Works</a>
        <a href="#team">Team</a>
        <a href="#contact">Contact</a>
      </nav>

      <a class="header-contact" href="#contact">
        CONTACT US
      </a>

    </div>
  </header>


  <!-- MAIN -->
  <main>

    <!-- HERO -->
    <section class="hero" id="home">

      <div class="hero-overlay"></div>

      <div class="container hero-content">

        <div class="ng-slash"></div>

        <p class="hero-eyebrow">
          NEXTGEN TRAINING TEAM
        </p>

        <h1 class="hero-title">
          EMPOWER PEOPLE.<br>
          <span>BUILD STRONGER TEAMS.</span>
        </h1>

        <p class="hero-description">
          Corporate Training, Team Building, Sport Day
          and creative activities designed to strengthen
          people and organizations.
        </p>

        <div class="hero-actions">

          <a
            href="#services"
            class="btn btn-primary"
          >
            OUR SERVICES
          </a>

          <a
            href="#portfolio"
            class="btn btn-outline"
          >
            VIEW OUR WORK
          </a>

        </div>

      </div>

      <div class="hero-scroll">
        SCROLL
        <span></span>
      </div>

    </section>

  </main>

</body>
</html>
