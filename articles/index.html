
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>บทความและความรู้สำหรับองค์กร | NG Training</title>

  <meta name="description"
        content="บทความ Team Building การพัฒนาบุคลากร และจิตวิทยาองค์กรจาก NG Training">

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Prompt:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/css/variables.css">

  <style>
    * {
      box-sizing: border-box;
    }

    
    body {
      margin: 0;
      background: var(--color-background-soft);
      color: var(--color-text);
      font-family: var(--font-primary);
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    .brand,
    .eyebrow,
    .article-category {
      font-family: var(--font-heading);
    }


    .header {
      background: var(--color-primary);
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      color: white;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .brand span {
      color: #f4511e;
    }

    .back-link {
      color: white;
      text-decoration: none;
      font-size: 13px;
    }

    .hero {
      padding: 80px 6% 55px;
      max-width: 1200px;
      margin: auto;
    }

    .eyebrow {
      color: #f4511e;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 76px);
      margin: 14px 0;
      line-height: 1.1;
    }

    .hero p {
      max-width: 680px;
      color: #666;
      line-height: 1.8;
    }

    .articles {
      max-width: 1200px;
      margin: auto;
      padding: 0 6% 90px;
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
    }

    .article-card {
      background: white;
      overflow: hidden;
      border: 1px solid #e5e5e5;
      text-decoration: none;
      color: inherit;
      transition: transform .2s;
    }

    .article-card:hover {
      transform: translateY(-5px);
    }

    .article-image {
      width: 100%;
      aspect-ratio: 1200 / 630;
      object-fit: cover;
      background: #eaeaea;
      display: block;
    }

    .article-body {
      padding: 26px;
    }

    .article-category {
      color: #f4511e;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .article-title {
      font-size: 22px;
      line-height: 1.4;
      margin: 12px 0;
    }

    .article-excerpt {
      font-size: 14px;
      color: #666;
      line-height: 1.8;
    }

    .read-more {
      display: inline-block;
      margin-top: 18px;
      color: #f4511e;
      font-size: 13px;
      font-weight: bold;
    }

    .notice {
      grid-column: 1 / -1;
      color: #666;
      padding: 30px 0;
    }

    footer {
      background: var(--color-primary);
      color: #aaa;
      padding: 30px 6%;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header class="header">
    <a class="brand" href="/">
      NG <span>TRAINING</span>
    </a>

    <a class="back-link" href="/">
      กลับหน้าเว็บไซต์ →
    </a>
  </header>

  <section class="hero">
    <div class="eyebrow">
      NG TRAINING | INSIGHTS
    </div>

    <h1>ARTICLES & INSIGHTS</h1>

    <p>
      ความรู้ด้าน Team Building
      การพัฒนาบุคลากร
      และแนวคิดการสร้างทีมที่มีประสิทธิภาพ
      สำหรับองค์กรยุคใหม่
    </p>
  </section>

  <main>
    <section
      class="articles"
      id="articles-container"
      aria-label="รายการบทความ"
    >
      <p class="notice">
        กำลังโหลดบทความ...
      </p>
    </section>
  </main>

  <footer>
    © NG Training. All rights reserved.
  </footer>

  <script src="/js/public-articles.js" defer></script>

</body>
</html>
